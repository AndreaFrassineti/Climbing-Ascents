name: Sync 8a.nu Ascents

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          EIGHT_A_COOKIE: ${{ secrets.EIGHT_A_COOKIE }}
        run: python sync_8anu.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ascents.json
          git commit -m "Update ascents [skip ci]" || exit 0
          git push
