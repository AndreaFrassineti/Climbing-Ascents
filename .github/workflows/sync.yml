name: Auto Sync 8a.nu

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui sync da 8a.nu
        run: python sync_8anu.py

      - name: Commit e Push dei dati aggiornati
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add data/
          git commit -m "Auto-sync 8a.nu [skip ci]" || echo "Nessun cambiamento da salvare"
          git push origin main
